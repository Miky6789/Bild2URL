<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bild zu URL</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#38bdf8;--ok:#22c55e;--bad:#ef4444}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#1e293b,#020617);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(920px,100%)} .card{background:rgba(17,24,39,.88);border:1px solid rgba(148,163,184,.2);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:clamp(30px,5vw,48px)} p{color:var(--muted);line-height:1.5}.drop{margin:22px 0;padding:34px;border:2px dashed rgba(56,189,248,.55);border-radius:20px;text-align:center;background:rgba(2,6,23,.35);cursor:pointer;transition:.18s}
    .drop.drag{transform:scale(1.01);border-color:var(--accent);background:rgba(56,189,248,.08)} input[type=file]{display:none}.row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0} input,button{border-radius:12px;border:1px solid rgba(148,163,184,.25);padding:13px 14px;font-size:15px} input{background:#020617;color:var(--text);width:100%}button{background:var(--accent);color:#00111a;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.small{font-size:13px;color:var(--muted)}
    .result{display:none;margin-top:18px;padding:16px;border-radius:16px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35)}.error{display:none;margin-top:18px;padding:16px;border-radius:16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fecaca}.preview{max-width:100%;max-height:320px;border-radius:16px;margin:16px 0;display:none}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}.tile{background:#020617;border:1px solid rgba(148,163,184,.18);border-radius:14px;overflow:hidden}.tile img{width:100%;height:110px;object-fit:cover;display:block}.tile a{display:block;padding:10px;color:#bae6fd;text-decoration:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  </style>
</head>
<body>
<main class="card">
  <h1>Bild zu URL</h1>
  <p>Lade ein Bild hoch und erhalte direkt eine kopierbare Bildadresse. Funktioniert mit GitHub Pages + Cloudflare Worker + R2.</p>

  <label class="drop" id="drop">
    <strong>Bild hier reinziehen</strong><br>
    <span class="small">oder klicken · JPG, PNG, WebP, GIF · max. 8 MB</span>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
  </label>

  <img id="preview" class="preview" alt="Vorschau" />

  <div class="row">
    <input id="token" type="password" placeholder="Upload-Passwort" autocomplete="current-password" />
    <button id="upload" disabled>Hochladen</button>
  </div>
  <div class="small">Das Passwort schützt deinen Upload. Besucher können Bilder anschauen, aber nicht ohne Passwort hochladen.</div>

  <div id="result" class="result">
    <strong>Fertig!</strong>
    <div class="row">
      <input id="url" readonly />
      <button id="copy">URL kopieren</button>
    </div>
  </div>
  <div id="error" class="error"></div>

  <section id="gallery" class="gallery"></section>
</main>

<script>
  // HIER ÄNDERN: deine Worker-Adresse eintragen, z.B. https://bild-upload.deinname.workers.dev
  const API_BASE = "https://bild2url.mikestaub705.workers.dev/";

  const fileInput = document.getElementById('file');
  const drop = document.getElementById('drop');
  const uploadBtn = document.getElementById('upload');
  const preview = document.getElementById('preview');
  const token = document.getElementById('token');
  const result = document.getElementById('result');
  const errorBox = document.getElementById('error');
  const urlInput = document.getElementById('url');
  const gallery = document.getElementById('gallery');
  let selectedFile = null;

  function showError(msg){ errorBox.textContent = msg; errorBox.style.display='block'; result.style.display='none'; }
  function clearError(){ errorBox.style.display='none'; }
  function setFile(file){
    clearError();
    if(!file) return;
    if(!file.type.startsWith('image/')) return showError('Bitte wähle eine Bilddatei aus.');
    if(file.size > 8 * 1024 * 1024) return showError('Das Bild ist zu gross. Maximal 8 MB.');
    selectedFile = file; uploadBtn.disabled = false;
    preview.src = URL.createObjectURL(file); preview.style.display = 'block';
  }
  fileInput.addEventListener('change', e => setFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.remove('drag')}));
  drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  uploadBtn.addEventListener('click', async () => {
    if(!selectedFile) return;
    if(!token.value.trim()) return showError('Bitte gib dein Upload-Passwort ein.');
    uploadBtn.disabled = true; uploadBtn.textContent = 'Lädt hoch...'; clearError();
    try{
      const form = new FormData();
      form.append('file', selectedFile);
      const res = await fetch(API_BASE + '/upload', { method:'POST', headers:{ 'Authorization':'Bearer ' + token.value.trim() }, body: form });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || 'Upload fehlgeschlagen.');
      urlInput.value = data.url;
      result.style.display = 'block';
      const saved = JSON.parse(localStorage.getItem('uploadedImages') || '[]');
      saved.unshift(data.url); localStorage.setItem('uploadedImages', JSON.stringify(saved.slice(0,12)));
      renderGallery();
    }catch(err){ showError(err.message); }
    finally{ uploadBtn.disabled = false; uploadBtn.textContent = 'Hochladen'; }
  });

  document.getElementById('copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(urlInput.value);
    document.getElementById('copy').textContent = 'Kopiert!';
    setTimeout(()=>document.getElementById('copy').textContent='URL kopieren',1200);
  });

  function renderGallery(){
    const saved = JSON.parse(localStorage.getItem('uploadedImages') || '[]');
    gallery.innerHTML = saved.map(u => `<div class="tile"><img src="${u}" alt=""><a href="${u}" target="_blank">${u}</a></div>`).join('');
  }
  renderGallery();
</script>
</body>
</html>
